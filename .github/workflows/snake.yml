name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Crop the SVGs to the contribution grid (removes outer margin and progress bar)
      - name: Crop snake to grid
        run: |
          perl -pi -e 's/viewBox="-16 -32 (\d+) (\d+)" width="\d+" height="\d+"/sprintf(q{viewBox="0 0 %d %d" width="%d" height="%d"},$1-32,$2-80,$1-32,$2-80)/e' dist/*.svg
          head -c 120 dist/github-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
